apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: techwave
  namespace: techwave
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
spec:
  ingressClassName: nginx
  rules:
    - host: techwave.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: techwave
                port:
                  name: http
